name: Tag @kitiumai/logger Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag (e.g., 2.0.1)'
        required: true
        type: string
      release_type:
        description: 'Release type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  tag-release:
    name: 'Create Release Tag'
    runs-on: ubuntu-latest
    container:
      image: docker.io/ashishyd/kitiumai-dev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Resolve package directory
        id: pkg
        run: |
          if [ -d "packages/core/@kitiumai/logger" ]; then
            echo "path=packages/core/@kitiumai/logger" >> "$GITHUB_OUTPUT"
          else
            echo "path=." >> "$GITHUB_OUTPUT"
          fi

      - name: Environment health check
        run: |
          echo "📋 Environment diagnostics:"
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"
          echo "Git: $(git --version)"
          echo "Working directory: $(pwd)"
          echo "User: $(whoami)"

      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: $VERSION"
            echo "Version must be x.y.z (e.g., 1.0.0)"
            exit 1
          fi
          echo "✅ Valid version format: $VERSION"

      - name: Check if tag already exists
        id: check_tag
        run: |
          TAG="logger-v${{ inputs.version }}"
          if git tag -l | grep -q "^$TAG$"; then
            echo "❌ Tag $TAG already exists"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "✅ Tag $TAG is available"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Shared setup (build + lint + test)
        uses: ./.github/actions/kitium-shared-setup
        with:
          working-directory: ${{ steps.pkg.outputs.path }}
          run-build: 'true'
          run-lint: 'true'
          run-tests: 'true'
          run-typecheck: 'true'
          run-security-audit: 'true'

      - name: Check package version
        id: version_check
        run: |
          WORKDIR="${{ steps.pkg.outputs.path }}"
          cd "$WORKDIR"

          CURRENT_VERSION=$(node -p "require('./package.json').version")
          TARGET_VERSION="${{ inputs.version }}"

          if [ "$CURRENT_VERSION" = "$TARGET_VERSION" ]; then
            echo "✅ Version already set to $TARGET_VERSION"
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "📦 Version needs update: $CURRENT_VERSION → $TARGET_VERSION"
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update package.json version
        if: steps.version_check.outputs.needs_update == 'true'
        run: |
          WORKDIR="${{ steps.pkg.outputs.path }}"
          cd "$WORKDIR"

          TARGET_VERSION="${{ inputs.version }}"
          echo "📦 Updating package.json version to $TARGET_VERSION"
          npm version "$TARGET_VERSION" --no-git-tag-version

      - name: Create PR for version bump
        if: steps.version_check.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_VERSION="${{ inputs.version }}"
          BRANCH_NAME="release/logger-v$TARGET_VERSION"
          PKG_PATH="${{ steps.pkg.outputs.path }}/package.json"

          git checkout -b "$BRANCH_NAME"
          git add "$PKG_PATH"
          git commit -m "chore: bump @kitiumai/logger to v$TARGET_VERSION"
          git push origin "$BRANCH_NAME"

          gh pr create \
            --title "chore: bump @kitiumai/logger to v$TARGET_VERSION" \
            --body "## 📦 Version Bump

          This PR updates the @kitiumai/logger package version to \`$TARGET_VERSION\`.

          **Changes**
          - Updated \`${{ steps.pkg.outputs.path }}/package.json\` version field

          **Next Steps**
          1. Review and merge this PR
          2. Re-run the tag workflow after merge

          ---
          🤖 Auto-generated by the tag-release-logger workflow." \
            --base main \
            --head "$BRANCH_NAME"

          echo "✅ PR created successfully. Merge it and re-run this workflow."
          exit 0

      - name: Create and push tag
        if: steps.version_check.outputs.needs_update == 'false'
        run: |
          TAG="logger-v${{ inputs.version }}"
          echo "🏷️  Creating tag: $TAG"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Verify tag creation
        if: steps.version_check.outputs.needs_update == 'false'
        run: |
          TAG="logger-v${{ inputs.version }}"
          echo "✅ Tag created successfully: $TAG"
          echo "🔗 Tag URL: https://github.com/kitium-ai/logger/releases/tag/$TAG"
          echo "The release workflow will be triggered automatically."
